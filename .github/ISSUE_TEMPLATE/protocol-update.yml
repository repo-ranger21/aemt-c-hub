name: Protocol or guideline update
description: RI released a new protocol version, or AHA updated a guideline
title: "[update] "
labels: ["content", "protocol-update"]
body:
  - type: markdown
    attributes:
      value: |
        Use this when the source itself changed, rather than when a single card is wrong.
        Every affected card needs rechecking, so these are tracked separately.
  - type: dropdown
    id: which
    attributes:
      label: Which source changed?
      options:
        - RI Statewide EMS Protocols
        - AHA / AAP guidelines
        - Textbook edition
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: New version and effective date
      placeholder: "v2027.01, effective 2027-01-01"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to the new source
    validations:
      required: true
  - type: textarea
    id: changes
    attributes:
      label: Known changes
      description: Which protocols or doses moved, if you already know. Leave blank if the whole document needs a pass.
